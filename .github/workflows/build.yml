name: build
on:
  push:
  pull_request:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Plugin
        working-directory: plugin
        run: |
          mvn -B package
          mkdir -p dist && cp target/TCGuard-*.jar dist/
          mvn -B -q dependency:build-classpath -Dmdep.outputFile=cp.txt
          TEST_CLASSPATH=$(cat cp.txt) FUZZ_ITERATIONS=200000 tools/test.sh
      - name: Gate
        working-directory: gate
        run: |
          go vet ./...
          go test ./...
          tools/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: TCGuard
          path: |
            plugin/dist/TCGuard-*.jar
            dist/tcguard-gate-*
      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" plugin/dist/TCGuard-*.jar dist/tcguard-gate-*
